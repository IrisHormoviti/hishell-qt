# Machine-specific Qt/KF6 paths (a private Qt under ~/.local, Homebrew, a
# cross sysroot, ...) belong in ~/.cargo/config.toml, not here: Cargo merges
# the user config with this file, so the repo stays portable and a system
# Qt/KF6 is found by qttypes and build.rs on its own.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN/lib"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN/lib"]

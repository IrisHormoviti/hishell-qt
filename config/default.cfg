[Desktop Entry]
;; "Directory" "Application" "Link"
Type = Directory

; The title of this item, separate from the file name
; Leave blank to ignore
Name = ""

; Tooltip text for this item
; Leave blank to disable
Comment = ""

; Only applicable for "Application" items
; Launch the application in a terminal
Terminal = false

; Only applicable for "Application" items
; Run a command when clicking on the item
; This can actually also be used for directories marked as "Application"
Exec = ""

; Only applicable for "Link" items
; Open a URL with the system's default handler
URL = ""

; Override the icon for this item
; can be a relative or absolute path to an icon file or an xdg icon name
Icon = ".icon"

; Attach a scene by path that will be shown as this item's icon in directory views.
; The static icon may be preferred in some views
; This is not part of the standard desktop entry spec
DynamicIcon = ""

; Stash this item
; It will not be visible in the normal view
NoDisplay = false

[Layout]
; Path to the toolkit component or directory to be attached in that part of the window.
; Multiple elements in the array will be placed next to eachother.
Top = []
Middle = ["/home/iris", "./"]
Bottom = []

; The header is the top bar that provides window controls,
; avoid changing it unless necessary
Header = ["toolkit/PathBar", "toolkit/Spacer", "toolkit/MenuBar", "toolkit/WindowControl"]

; Show the navtive title bar.
; When enabled, window buttons like Close will be hidden
NativeTitleBar = true

; Use the native menubar at the top of the window or screen (depending on the enviroment).
; Alternatively, "toolkit/MenuBar" can be placed somewhere else in the layout.
NativeMenuBar = false

[Folder View]
; Controls the overall layout
;; "GRID" Show items in a grid
;; "LIST" Show items in a list with columns
ViewMode = GRID

; How to sort items
;; "FREE" "NEWEST" "OLDEST" "ALPHABETICAL"
Sort = NEWEST

; Which date value to use for sorting
;; "MODIFIED" "CREATED" "ACCESSED"
SortDateMode = MODIFIED

; Which name value to use for sorting
;; "TITLES" "FILENAMES"
SortAlphaMode = FILENAMES

; Hidden files starting with a . will be put away in the stash
StashDotFiles = true

; Labels will be shown for each Item
ShowLabels = true

; Labels will be next to items
GridLabelsBesidesIcons = false

; Direction the grid flows and scrolls: "VERTICAL" or "HORIZONTAL"
ScrollDirection = VERTICAL

; Number of lines before wrapping.
; With vertical scrolling this is the number of columns,
; with horizontal scrolling the number of rows.
; 0 fits as many lines as the window allows.
Lines = 0

; Alignment of the grid when it doesn't fill the view.
; With Lines set, a non-FILL pane placed next to other panes only takes the
; width its columns need, and the remaining space goes to the FILL panes.
; "FILL" "LEFT" "CENTER" "RIGHT"
GridHorizontalAlign = FILL

; "FILL" "TOP" "CENTER" "BOTTOM"
GridVerticalAlign = TOP

; Icon size in the grid.
GridSize = 64

; Stores manually placed item positions by name in FREE sort mode.
; Each value is a zero-based [column, row] grid coordinate.
; Example: "test.txt" : [5, 3]
FreePlacementPositions = { }

; Background image of a directory.
Wallpaper = ".wallpaper"

; When this window opens, it will be maximized
Maximized = false

[Folder Navigation]
; Set what happens when navigating to a new location in this window
;; AUTO: The system decides
;; IN_PLACE: Replace the current window's location with the new one
;; WINDOW: Open a new window
NavigationType = AUTO

; Keep the focused item centered in the view whenever the focus moves
CenterFocus = true

; Animate the view when the focus moves
SmoothScrolling = true

; The user can focus on empty space in the grid
FocusEmptySlots = false

; Items will open when clicked or tapped
; If false, items will be focused when clicked or tapped,
; and will only open once clicked or tapped while focused.
OpenOnClick = true

[package]
name = "hishell-qt"
version = "0.1.0"
edition = "2024"
links = "hishell-qt"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
md5 = "0.8.1"
image = "0.25.10"
crossbeam-channel = "0.5.17"
mime_guess = "2.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
once_cell = "1.18"
trash = "5.2.9"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
regex = "1.13.1"
walkdir = "2.5.0"


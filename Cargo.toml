[package]
name = "hishell-qt"
version = "0.1.0"
edition = "2024"

# The app is a library so a host process can load it, and a binary so it still
# runs standalone on a desktop with system Qt.
[lib]
name = "hishell_qt"
path = "src/lib.rs"

[[bin]]
name = "hishell-qt"
path = "src/main.rs"

[dependencies]
qmetaobject = "0.2.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
md5 = "0.8.1"
flate2 = "1.1"
zstd = "0.14"
image = "0.25.10"
png = "0.18"
crossbeam-channel = "0.5.17"
mime_guess = "2.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
once_cell = "1.18"
libc = "0.2"
trash = "5.2.9"
gilrs = "0.11"
# Supplies DEP_QT_* build metadata (Qt include paths) used by build.rs
qttypes = "0.2"


[build-dependencies]
cc = "1.3"
regex = "1.13.1"
walkdir = "2.5.0"


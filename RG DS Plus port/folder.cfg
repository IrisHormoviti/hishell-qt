[Desktop Entry]
Type = Directory

[Layout]
Top = []
Middle = ["~", "."]
Bottom = []

Header = ["toolkit/PathBar", "toolkit/Spacer", "toolkit/MenuBar", "toolkit/WindowControl"]

; The RG DS Plus runs weston without server-side decorations and without a
; plasma workspace, so the in-window header carries the controls.
NativeTitleBar = false

NativeMenuBar = false

; Open on the bottom (touch) panel, which weston exposes as the second output.
Screen = "DSI-2"

[Folder View]
ViewMode = GRID

Sort = ALPHABETICAL

SortDateMode = MODIFIED

SortAlphaMode = FILENAMES

StashDotFiles = true

ShowLabels = true

; A label under the icon reads better on a touch panel than a cramped row.
GridLabelsBesidesIcons = false

LabelText = TITLE

ScrollDirection = VERTICAL

Lines = 0

GridHorizontalAlign = FILL

GridVerticalAlign = TOP

; Larger hit targets for the 4.3" 1024x768 touch panel.
GridSize = 96

FreePlacementPositions = { }

Wallpaper = ".wallpaper"

; Open fullscreen so the window covers the stock launcher (dmenu) instead of
; sitting behind it, and so it lands on a single panel.
Maximized = true

[Folder Navigation]
NavigationType = IN_PLACE

CenterFocus = true

SmoothScrolling = true

DropItemPreference = MOVE

DropItemPreferenceMandate = false

FocusEmptySlots = false

OpenOnClick = true
